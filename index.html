<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fast-Forward | Merchant Feedback</title>
    <meta
      name="description"
      content="Share your feedback on Fast-Forward Courier and Delivery Services. 5 questions, about 60 seconds."
    />
    <link rel="icon" type="image/png" href="./images/logo.png" />
    <link rel="preload" as="image" href="./images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #bc001f;
        --brand-bright: #f5164a;
        --ink: #14171a;
        --muted: #6b7280;
        --line: #ececef;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: var(--ink);
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        text-align: center;
        overflow-x: hidden;
      }

      /* soft brand wash, pure CSS - no image requests */
      body::before {
        content: "";
        position: fixed;
        top: -20%;
        right: -30%;
        width: 70vw;
        height: 70vw;
        max-width: 620px;
        max-height: 620px;
        background: radial-gradient(circle, rgba(188, 0, 31, 0.07) 0%, rgba(188, 0, 31, 0) 70%);
        pointer-events: none;
        z-index: 0;
      }

      .stage { position: relative; z-index: 1; width: 100%; max-width: 520px; }

      /* --- logo + fast-forward streaks --- */
      /* block-level flex so the logo always occupies its own line */
      .logo-wrap {
        display: flex;
        justify-content: center;
        margin-bottom: 28px;
      }

      /* shrink-wraps the logo, and is the positioning context for the streaks */
      .logo-frame {
        position: relative;
        display: inline-block;
        max-width: 100%;
      }

      .logo {
        display: block;
        width: 100%;
        max-width: 300px;
        height: auto;
        animation: logo-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      @media (min-width: 640px) {
        .logo { max-width: 340px; }
      }

      .streaks {
        position: absolute;
        left: -13%;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 7px;
        pointer-events: none;
      }

      .streak {
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(245, 22, 74, 0) 0%, var(--brand-bright) 100%);
        animation: streak 1.5s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      .streak:nth-child(1) { width: 30px; animation-delay: 0.05s; }
      .streak:nth-child(2) { width: 46px; animation-delay: 0.14s; }
      .streak:nth-child(3) { width: 22px; animation-delay: 0.23s; }

      @keyframes logo-in {
        from { opacity: 0; transform: translateX(-18px) scale(0.97); }
        to   { opacity: 1; transform: translateX(0) scale(1); }
      }

      @keyframes streak {
        0%   { opacity: 0; transform: translateX(-26px) scaleX(0.3); }
        45%  { opacity: 1; }
        100% { opacity: 0; transform: translateX(46px) scaleX(1); }
      }

      /* --- copy --- */
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--brand);
        background: rgba(188, 0, 31, 0.07);
        padding: 7px 14px;
        border-radius: 999px;
        margin-bottom: 20px;
        animation: rise 0.6s ease 0.25s both;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--brand);
        animation: pulse 2s ease-in-out infinite;
      }

      h1 {
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: clamp(28px, 7.5vw, 40px);
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 14px;
        animation: rise 0.6s ease 0.35s both;
      }

      h1 em { color: var(--brand); font-style: italic; }

      .sub {
        font-size: clamp(15px, 4vw, 17px);
        line-height: 1.6;
        color: var(--muted);
        margin: 0 auto 32px;
        max-width: 27em;
        animation: rise 0.6s ease 0.45s both;
      }

      /* --- CTA --- */
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        max-width: 340px;
        padding: 17px 32px;
        background: var(--brand);
        color: #fff;
        font-family: "Manrope", sans-serif;
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
        border-radius: 14px;
        box-shadow: 0 10px 26px rgba(188, 0, 31, 0.22);
        transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
        animation: rise 0.6s ease 0.55s both;
      }

      .cta:hover { background: #a30019; box-shadow: 0 12px 30px rgba(188, 0, 31, 0.3); }
      .cta:active { transform: translateY(2px); box-shadow: 0 6px 16px rgba(188, 0, 31, 0.22); }
      .cta:focus-visible { outline: 3px solid rgba(188, 0, 31, 0.4); outline-offset: 3px; }

      .arrow { font-size: 19px; line-height: 1; transition: transform 0.2s ease; }
      .cta:hover .arrow { transform: translateX(4px); }

      .meta {
        margin: 26px 0 0;
        font-size: 12px;
        line-height: 1.7;
        color: #9aa0a6;
        animation: rise 0.6s ease 0.65s both;
      }

      .meta strong { color: var(--muted); font-weight: 600; }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001s !important;
          animation-delay: 0s !important;
          transition-duration: 0.001s !important;
        }
        .streaks { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="logo-wrap">
        <div class="logo-frame">
          <div class="streaks" aria-hidden="true">
            <span class="streak"></span>
            <span class="streak"></span>
            <span class="streak"></span>
          </div>
          <img class="logo" src="./images/logo.png" alt="Fast-Forward Courier and Delivery Services" />
        </div>
      </div>

      <span class="eyebrow"><span class="dot" aria-hidden="true"></span>Merchant Feedback</span>

      <h1>Help us <em>serve you better</em></h1>

      <p class="sub">
        You partner with us to deliver to your customers. Tell us how we're doing —
        5 quick questions, about 60 seconds.
      </p>

      <a class="cta" href="./survey.html">
        Start survey
        <span class="arrow" aria-hidden="true">&rarr;</span>
      </a>

      <p class="meta">Your answers go directly to our team.</p>
    </main>
  </body>
</html>
