<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You | Fast-Forward</title>
    <meta name="description" content="Thank you for sharing your feedback with Fast-Forward Courier and Delivery Services." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="./images/logo.png" />
    <link rel="preload" as="image" href="./images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --brand: #bc001f;
        --brand-bright: #f5164a;
        --ink: #14171a;
        --muted: #6b7280;
        --faint: #9aa0a6;
        --line: #ececef;
        --wa: #1faa54;
        --wa-dark: #178843;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        background: #ffffff;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
        text-align: center;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        top: -25%;
        right: -30%;
        width: 70vw;
        height: 70vw;
        max-width: 620px;
        max-height: 620px;
        background: radial-gradient(circle, rgba(188, 0, 31, 0.07) 0%, rgba(188, 0, 31, 0) 70%);
        pointer-events: none;
      }

      .stage { position: relative; width: 100%; max-width: 480px; }

      /* ---------- animated success mark ---------- */
      .mark {
        position: relative;
        width: 96px;
        height: 96px;
        margin: 0 auto 30px;
      }

      .mark svg { width: 100%; height: 100%; display: block; }

      .ring {
        fill: none;
        stroke: var(--brand);
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-dasharray: 232;
        stroke-dashoffset: 232;
        animation: draw-ring 0.75s cubic-bezier(0.5, 0, 0.2, 1) 0.1s forwards;
      }

      .tick {
        fill: none;
        stroke: var(--brand);
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 42;
        stroke-dashoffset: 42;
        animation: draw-tick 0.4s cubic-bezier(0.6, 0, 0.3, 1) 0.7s forwards;
      }

      /* pulse that radiates out once the tick lands */
      .pulse {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid var(--brand);
        opacity: 0;
        animation: pulse 1.1s ease-out 0.95s;
      }

      @keyframes draw-ring { to { stroke-dashoffset: 0; } }
      @keyframes draw-tick { to { stroke-dashoffset: 0; } }
      @keyframes pulse {
        0%   { opacity: 0.55; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.45); }
      }

      /* ---------- copy ---------- */
      h1 {
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: clamp(27px, 7vw, 36px);
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 14px;
        animation: rise 0.55s ease 0.85s both;
      }

      h1 em { color: var(--brand); font-style: italic; }

      .sub {
        font-size: clamp(15px, 4vw, 16.5px);
        line-height: 1.6;
        color: var(--muted);
        margin: 0 auto 34px;
        max-width: 25em;
        animation: rise 0.55s ease 0.95s both;
      }

      /* ---------- WhatsApp CTA ---------- */
      .wa {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        width: 100%;
        max-width: 330px;
        padding: 16px 30px;
        background: var(--wa);
        color: #fff;
        font-family: "Manrope", sans-serif;
        font-size: 15.5px;
        font-weight: 700;
        text-decoration: none;
        border-radius: 14px;
        box-shadow: 0 10px 24px rgba(31, 170, 84, 0.25);
        transition: background 0.18s ease, box-shadow 0.2s ease, transform 0.14s ease;
        animation: rise 0.55s ease 1.05s both;
      }

      .wa:hover { background: var(--wa-dark); box-shadow: 0 12px 28px rgba(31, 170, 84, 0.32); }
      .wa:active { transform: translateY(2px); box-shadow: 0 6px 14px rgba(31, 170, 84, 0.25); }
      .wa:focus-visible { outline: 3px solid rgba(31, 170, 84, 0.45); outline-offset: 3px; }
      .wa svg { width: 20px; height: 20px; fill: currentColor; flex: none; }

      /* ---------- footer ---------- */
      .brandline {
        margin-top: 44px;
        animation: rise 0.55s ease 1.15s both;
      }

      .brandline img {
        width: 168px;
        max-width: 62%;
        height: auto;
        margin: 0 auto 12px;
        display: block;
      }

      .brandline p {
        margin: 0;
        font-size: 12px;
        color: var(--faint);
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001s !important;
          animation-delay: 0s !important;
          transition-duration: 0.001s !important;
        }
        .ring, .tick { stroke-dashoffset: 0 !important; }
        .pulse { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="mark">
        <span class="pulse" aria-hidden="true"></span>
        <svg viewBox="0 0 84 84" role="img" aria-label="Feedback received">
          <circle class="ring" cx="42" cy="42" r="37" />
          <path class="tick" d="M27 43.5 L37.5 54 L57 33" />
        </svg>
      </div>

      <h1>Thank you — your feedback is <em>in</em>.</h1>

      <p class="sub">
        It's gone straight to our customer success team, and every response gets read.
        If you left your number, we'll reach out about what you told us.
      </p>

      <a class="wa" href="https://wa.me/2348136033584" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347M12.05 21.785h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0 0 20.885 3.488" />
        </svg>
        Chat with us on WhatsApp
      </a>

      <div class="brandline">
        <img src="./images/logo.png" alt="Fast-Forward Courier and Delivery Services" />
        <p>Thanks for moving with us.</p>
      </div>
    </main>
  </body>
</html>
